[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "novainsight"
version = "0.1.0"
description = "Autonomous Data Analysis Agent that performs EDA using quantitative analysis and LLM interpretation."
readme = "README.md"
requires-python = ">=3.10"
authors = [ { name="Eyad Mostafa", email="eyadbu3@gmail.com" } ]

dependencies = [
    'pandas>=1.5',
    'numpy>=1.21',
    'scipy>=1.8',
    'pydantic>=2.0',
    'PyYAML>=6.0',
    'python-dotenv>=1.0',
    'scikit-learn>=1.2',
    'statsmodels>=0.13',
    'umap-learn>=0.5',
    'openpyxl>=3.0',
    'click>=8.0',
    'matplotlib>=3.5',
    'seaborn>=0.12',
    'python-toon>=0.1.3',
    'Jinja2>=3.0',
    'json-repair>=0.30',

    # --- Anticipated Dependencies ---

    # Reporting (for ReportGenerator)
    # 'nbformat>=5.0',
    # 'WeasyPrint>=55.0', # Note: Often requires external system dependencies (Pango, Cairo)
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-mock",
]
gemini = [
    "google-genai>=2.0",
]
anthropic = [
    "anthropic>=0.102.0",
]
openai = [
    "openai>=2.37.0",
]
all-providers = [
    "google-genai>=2.3.0",
    "anthropic>=0.102.0",
    "openai>=2.37.0",
]

[project.scripts]
novainsight = "novainsight.interfaces.cli:main"

[tool.setuptools.packages.find]
include = ["novainsight*"]

[tool.pytest.ini_options]
pythonpath = "."

