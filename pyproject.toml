[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
# --- Core Project Metadata ---
name = "novainsight"
version = "0.1.0"

# --- Optional Dependencies (for testing) ---
[project.optional-dependencies]
test = [
    "pytest",
    "pytest-mock",
]

# --- THE FIX IS HERE: Entry Point ---
[project.scripts]
novainsight = "novainsight.interfaces.cli:main"


# ===================================================================
# Tool-Specific Configurations
# ===================================================================

[tool.setuptools]
packages = ["novainsight"]

[tool.pytest.ini_options]
pythonpath = "."

